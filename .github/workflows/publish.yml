name: Release

on:
  push:
    tags: ["v*.*.*"]

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Linux x86_64,   os: ubuntu-22.04,   target: x86_64-unknown-linux-gnu,  ext: ""     }
          - { name: Windows x86_64, os: windows-latest, target: x86_64-pc-windows-msvc,    ext: ".exe" }
          - { name: macOS x86_64,   os: macos-13,       target: x86_64-apple-darwin,       ext: ""     }
          - { name: macOS ARM64,    os: macos-latest,   target: aarch64-apple-darwin,      ext: ""     }

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y cmake ninja-build python3 libvulkan-dev

      - name: Install macOS deps
        if: runner.os == 'macOS'
        run: brew install cmake ninja python@3

      - name: Install Vulkan SDK (Windows + macOS)
        if: runner.os != 'Linux'
        uses: humbletim/install-vulkan-sdk@v1.1.1
        with:
          version: latest

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: target/${{ matrix.target }}/release/*${{ matrix.ext }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}