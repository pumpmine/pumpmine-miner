name: Build and Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            use-cross: false

          # Linux ARM
          - os: ubuntu-22.04
            target: aarch64-unknown-linux-gnu
            use-cross: true

          # Windows (DO NOT TOUCH shaderc here)
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            use-cross: false

          # macOS Intel
          - os: macos-latest
            target: x86_64-apple-darwin
            use-cross: false

          # macOS ARM
          - os: macos-latest
            target: aarch64-apple-darwin
            use-cross: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ---------------------------
      # Install shaderc (Linux + macOS ONLY)
      # ---------------------------

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            cmake \
            ninja-build \
            build-essential \
            python3

      - name: Build shaderc (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          git clone https://github.com/google/shaderc.git
          cd shaderc

          ./utils/git-sync-deps

          mkdir build
          cd build

          cmake -GNinja -DCMAKE_BUILD_TYPE=Release ..
          ninja

          echo "SHADERC_LIB_DIR=$PWD/libshaderc" >> $GITHUB_ENV
          echo "SHADERC_INCLUDE_DIR=$(pwd)/../libshaderc/include" >> $GITHUB_ENV

      # ---------------------------
      # Rust toolchain
      # ---------------------------

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # ---------------------------
      # Cross (Linux ARM only)
      # ---------------------------

      - name: Install cross
        if: matrix.use-cross == true
        run: cargo install cross

      # ---------------------------
      # Build
      # ---------------------------

      - name: Build
        shell: bash
        run: |
          if [ "${{ matrix.use-cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi

      # ---------------------------
      # Package
      # ---------------------------

      - name: Package binary
        shell: bash
        run: |
          APP_NAME=$(basename $(pwd))

          if [[ "${{ matrix.target }}" == *"windows"* ]]; then
            BIN_NAME="${APP_NAME}.exe"
          else
            BIN_NAME="${APP_NAME}"
          fi

          mkdir -p dist
          cp target/${{ matrix.target }}/release/$BIN_NAME dist/

          strip dist/$BIN_NAME || true

          ARCHIVE="${APP_NAME}-${{ matrix.target }}"

          if [[ "${{ matrix.target }}" == *"windows"* ]]; then
            powershell Compress-Archive dist/$BIN_NAME dist/$ARCHIVE.zip
          else
            tar -czf dist/$ARCHIVE.tar.gz -C dist $BIN_NAME
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*

  release:
    name: Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}