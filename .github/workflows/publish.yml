name: Release

on:
  push:
    tags: ["v*.*.*"]

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Linux x86_64,   os: ubuntu-22.04,   target: x86_64-unknown-linux-gnu,  bin: pumpmine-miner,     out: pumpmine-miner-linux-x86_64       }
          - { name: Windows x86_64, os: windows-latest, target: x86_64-pc-windows-msvc,    bin: pumpmine-miner.exe, out: pumpmine-miner-windows-x86_64.exe }
          - { name: macOS ARM64,    os: macos-latest,   target: aarch64-apple-darwin,      bin: pumpmine-miner,     out: pumpmine-miner-macos-arm64        }

    steps:
      - uses: actions/checkout@v4

      - name: Install deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y cmake ninja-build python3 libvulkan-dev

      - name: Install deps (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install cmake ninja python@3
          echo "CMAKE_POLICY_VERSION_MINIMUM=3.5" >> $GITHUB_ENV

      - name: Install deps (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install cmake ninja python3 --yes --no-progress

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # Cache cargo registry (shared across all runs)
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-registry-

      # Cache build artifacts (per target, invalidated when src or deps change)
      - uses: actions/cache@v4
        with:
          path: target
          key: build-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock', 'src/**') }}
          restore-keys: build-${{ matrix.target }}-

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Stage binary
        shell: bash
        run: |
          mkdir dist
          cp target/${{ matrix.target }}/release/${{ matrix.bin }} dist/${{ matrix.out }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/${{ matrix.out }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}