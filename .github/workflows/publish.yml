name: Release

on:
  push:
    tags: ["v*.*.*"]

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Linux x86_64,    os: ubuntu-22.04,   target: x86_64-unknown-linux-gnu,  bin: pumpmine-miner,     out: pumpmine-miner-linux-x86_64       }
          - { name: Windows x86_64,  os: windows-latest, target: x86_64-pc-windows-msvc,    bin: pumpmine-miner.exe, out: pumpmine-miner-windows-x86_64.exe }
          - { name: macOS x86_64,    os: macos-13,       target: x86_64-apple-darwin,       bin: pumpmine-miner,     out: pumpmine-miner-macos-x86_64       }
          - { name: macOS ARM64,     os: macos-latest,   target: aarch64-apple-darwin,      bin: pumpmine-miner,     out: pumpmine-miner-macos-arm64        }

    steps:
      - uses: actions/checkout@v4

      - name: Install deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y cmake ninja-build python3 libvulkan-dev

      - name: Install deps (macOS)
        if: runner.os == 'macOS'
        run: brew install cmake ninja python@3

      - name: Install deps (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install cmake ninja python3 --yes --no-progress

      # shaderc-sys 0.8.3 bundles an old CMakeLists that breaks on CMake 4.x
      - name: Fix shaderc CMake compat
        shell: bash
        run: echo "CMAKE_POLICY_VERSION_MINIMUM=3.5" >> $GITHUB_ENV

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-registry-

      - uses: actions/cache@v4
        with:
          path: target
          key: build-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock', 'src/**') }}
          restore-keys: build-${{ matrix.target }}-

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Stage binary
        shell: bash
        run: |
          mkdir dist
          cp target/${{ matrix.target }}/release/${{ matrix.bin }} dist/${{ matrix.out }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/${{ matrix.out }}
          if-no-files-found: error

  # Build a universal macOS binary (x86_64 + arm64 in one fat binary)
  macos-universal:
    name: macOS Universal
    needs: build
    runs-on: macos-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: x86_64-apple-darwin
          path: x86_64

      - uses: actions/download-artifact@v4
        with:
          name: aarch64-apple-darwin
          path: arm64

      - name: Create universal binary
        run: |
          mkdir dist
          lipo -create \
            x86_64/pumpmine-miner-macos-x86_64 \
            arm64/pumpmine-miner-macos-arm64 \
            -output dist/pumpmine-miner-macos-universal
          lipo -info dist/pumpmine-miner-macos-universal

      - uses: actions/upload-artifact@v4
        with:
          name: macos-universal
          path: dist/pumpmine-miner-macos-universal
          if-no-files-found: error

  release:
    needs: [build, macos-universal]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}